name: Personal Knowledge Hub CI

on:
  push:
    branches: [ master ]
  pull_request: 
    branches: [ master ]
    
permissions:
  contents: read
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore PersonalKnowledgeHub.slnx
        
      - name: Build project
        run: >
          dotnet build PersonalKnowledgeHub.slnx 
          --configuration Release 
          --no-restore
        
      - name: Run tests
        run: >
          dotnet test PersonalKnowledgeHub.slnx 
          --configuration Release 
          --no-build 
          --filter "FullyQualifiedName!~SupabaseStorageTests"