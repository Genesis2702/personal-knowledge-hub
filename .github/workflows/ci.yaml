name: Personal Knowledge Hub CI

on:
  push:
    branches: [ master ]
  pull_request: 
    branches: [ master ]
    
permissions:
  contents: read
  packages: write
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore PersonalKnowledgeHub.slnx
        
      - name: Build project
        run: >
          dotnet build PersonalKnowledgeHub.slnx 
          --configuration Release 
          --no-restore
        
      - name: Run tests
        run: >
          dotnet test PersonalKnowledgeHub.slnx 
          --configuration Release 
          --no-build 
          --filter "FullyQualifiedName!~SupabaseStorageTests"
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/genesis2702/personal-knowledge-hub:latest
            ghcr.io/genesis2702/personal-knowledge-hub:sha-${{ github.sha }}