services: 
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5165:8080"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ConnectionStrings__DefaultConnection: ${POSTGRES_CONNECTION}
      RedisCacheSettings__ConnectionString: ${REDIS_CONNECTION}
      MailSettings__Host: ${MAILSETTINGS_HOST}
      MailSettings__Port: ${MAILSETTINGS_PORT}
      MailSettings__Name: ${MAILSETTINGS_NAME}
      MailSettings__EmailId: ${MAILSETTINGS_EMAILID}
      MailSettings__UserName: ${MAILSETTINGS_USERNAME}
      MailSettings__Password: ${MAILSETTINGS_PASSWORD}
      MailSettings__UseSSL: ${MAILSETTINGS_USESSL}
      Supabase__Url: ${SUPABASE_URL}
      Supabase__Key: ${SUPABASE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  postgres:
    image: postgres:16
    container_name: postgres-server
    restart: unless-stopped
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    
  redis:
    image: redis:7
    container_name: redis-server
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: 
      - "6379:6379"
    volumes: 
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q '^PONG$'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    restart: unless-stopped
    ports: 
      - "9090:9090"
    volumes:
      - ./src/PersonalKnowledgeHub.Api/Observability/Prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    restart: unless-stopped
    ports: 
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on: 
      - prometheus
  
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
